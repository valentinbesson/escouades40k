name: Mise à jour des données (BSData)

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger BSData (Warhammer 40,000 10e)
        run: git clone --depth 1 https://github.com/BSData/wh40k-11e.git /tmp/bsdata

      - name: Générer data/units.json
        run: python3 scripts/build_units.py /tmp/bsdata data/units.json

      - name: Enregistrer si les données ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/units.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Mise à jour des données BSData"
            git pull --rebase origin main
            git push
          fi
